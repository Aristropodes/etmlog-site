<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · ETMLOG</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-simbolo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--azul:#082744;--primario:#3370DB;--acento:#F27507;--claro:#f4f6f9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--azul);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .wrap{max-width:520px}
  img{height:48px;margin-bottom:32px}
  .code{font-size:5rem;font-weight:700;line-height:1;color:var(--acento)}
  h1{font-size:1.5rem;font-weight:600;margin:16px 0 12px}
  p{color:#aebccd;line-height:1.6;margin-bottom:28px}
  a.btn{display:inline-block;background:var(--primario);color:#fff;text-decoration:none;font-weight:600;padding:12px 26px;border-radius:8px;transition:background .2s}
  a.btn:hover{background:#285fc0}
</style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/logo-branco.svg" alt="ETMLOG">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você procurou não existe ou foi movido. Vamos te levar de volta ao caminho certo.</p>
    <a class="btn" href="/">Voltar para a página inicial</a>
  </div>
</body>
</html>
